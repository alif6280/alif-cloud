<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="45%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4c1d95;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e9d5ff"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle dot pattern -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#a78bfa" opacity="0.15"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- Decorative circles background -->
  <circle cx="100" cy="80" r="120" fill="#6d28d9" opacity="0.08"/>
  <circle cx="1100" cy="320" r="150" fill="#7c3aed" opacity="0.08"/>
  <circle cx="600" cy="50" r="80" fill="#a78bfa" opacity="0.05"/>

  <!-- Wave layers -->
  <path d="M0,300 C150,260 300,340 450,300 C600,260 750,320 900,290 C1050,260 1150,300 1200,280 L1200,400 L0,400 Z" fill="url(#waveGrad1)"/>
  <path d="M0,330 C200,300 350,360 550,330 C750,300 900,350 1100,320 C1150,312 1180,318 1200,315 L1200,400 L0,400 Z" fill="url(#waveGrad2)"/>
  <path d="M0,360 C250,340 500,375 750,355 C900,342 1050,365 1200,350 L1200,400 L0,400 Z" fill="#6d28d9" opacity="0.25"/>

  <!-- Cloud icon SVG path -->
  <g transform="translate(510, 80)" filter="url(#glow)" opacity="0.9">
    <text font-size="72" fill="white" opacity="0.9">☁️</text>
  </g>

  <!-- Main Title -->
  <text
    x="600"
    y="210"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="78"
    font-weight="800"
    fill="url(#textGrad)"
    text-anchor="middle"
    letter-spacing="3"
    filter="url(#glow)"
  >ALIF CLOUD</text>

  <!-- Subtitle -->
  <text
    x="600"
    y="268"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="400"
    fill="#c4b5fd"
    text-anchor="middle"
    letter-spacing="1.5"
    opacity="0.95"
  >Your Personal Cloud Storage — Beautiful, Fast &amp; Secure</text>

  <!-- Decorative line under subtitle -->
  <line x1="450" y1="290" x2="750" y2="290" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Small decorative stars/sparkles -->
  <g fill="#a78bfa" opacity="0.6" filter="url(#softglow)">
    <polygon points="180,120 185,135 200,135 188,144 192,160 180,151 168,160 172,144 160,135 175,135" transform="scale(0.6) translate(120,80)"/>
    <polygon points="180,120 185,135 200,135 188,144 192,160 180,151 168,160 172,144 160,135 175,135" transform="scale(0.4) translate(2500,300)"/>
    <polygon points="180,120 185,135 200,135 188,144 192,160 180,151 168,160 172,144 160,135 175,135" transform="scale(0.3) translate(400,900)"/>
  </g>
</svg>
