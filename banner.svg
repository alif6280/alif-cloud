<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0b1e"/>
      <stop offset="50%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d0b1e"/>
    </linearGradient>
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b21b6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e9d5ff"/>
      <stop offset="40%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .wave1 { animation: wave1move 6s ease-in-out infinite; }
      .wave2 { animation: wave2move 8s ease-in-out infinite; }
      .wave3 { animation: wave3move 5s ease-in-out infinite; }
      .title { animation: titleglow 3s ease-in-out infinite alternate; }
      .star1 { animation: twinkle 2s ease-in-out infinite; }
      .star2 { animation: twinkle 3s ease-in-out 1s infinite; }
      .star3 { animation: twinkle 2.5s ease-in-out 0.5s infinite; }
      .star4 { animation: twinkle 4s ease-in-out 1.5s infinite; }

      @keyframes wave1move {
        0%   { transform: translateX(0px); }
        50%  { transform: translateX(-30px); }
        100% { transform: translateX(0px); }
      }
      @keyframes wave2move {
        0%   { transform: translateX(0px); }
        50%  { transform: translateX(25px); }
        100% { transform: translateX(0px); }
      }
      @keyframes wave3move {
        0%   { transform: translateX(0px); }
        50%  { transform: translateX(-20px); }
        100% { transform: translateX(0px); }
      }
      @keyframes titleglow {
        0%   { filter: url(#glow); opacity: 0.9; }
        100% { filter: url(#glow); opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50%       { opacity: 0.8; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <!-- Dot pattern -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.8" fill="#a78bfa" opacity="0.12"/>
  </pattern>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Stars -->
  <circle class="star1" cx="120" cy="50"  r="2" fill="#e9d5ff"/>
  <circle class="star2" cx="950" cy="35"  r="1.5" fill="#c4b5fd"/>
  <circle class="star3" cx="200" cy="160" r="1.5" fill="#ddd6fe"/>
  <circle class="star4" cx="1050" cy="120" r="2" fill="#e9d5ff"/>
  <circle class="star1" cx="350" cy="30"  r="1" fill="#c4b5fd"/>
  <circle class="star2" cx="800" cy="70"  r="1" fill="#ddd6fe"/>
  <circle class="star3" cx="650" cy="20"  r="1.5" fill="#e9d5ff"/>
  <circle class="star4" cx="1150" cy="60" r="1" fill="#c4b5fd"/>

  <!-- Animated Waves -->
  <path class="wave3" d="M-50,200 C100,170 250,220 400,195 C550,170 700,215 850,190 C1000,165 1150,205 1300,185 L1300,280 L-50,280 Z" fill="url(#wave3Grad)" opacity="0.6"/>
  <path class="wave1" d="M-50,215 C120,185 280,230 450,208 C620,185 780,228 950,205 C1080,188 1180,215 1300,200 L1300,280 L-50,280 Z" fill="url(#wave1Grad)" opacity="0.75"/>
  <path class="wave2" d="M-50,232 C150,210 320,245 520,228 C720,210 880,240 1100,222 C1170,215 1240,228 1300,220 L1300,280 L-50,280 Z" fill="url(#wave2Grad)" opacity="0.9"/>

  <!-- Title -->
  <text
    class="title"
    x="600" y="135"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="80"
    font-weight="900"
    fill="url(#titleGrad)"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#glow)"
  >☁️ ALIF CLOUD</text>

  <!-- Subtitle -->
  <text
    x="600" y="183"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="300"
    fill="#c4b5fd"
    text-anchor="middle"
    letter-spacing="2"
    filter="url(#subtleglow)"
    opacity="0.9"
  >Your Personal Cloud Storage — Beautiful, Fast &amp; Secure</text>
</svg>
